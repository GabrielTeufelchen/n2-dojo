<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<!-- N2 道場：页面内容从这里开始（编辑说明见 README.md）-->
<title>N2 道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
.song-player,.song-course{display:grid;gap:12px}.song-player p,.song-course p{margin:6px 0}.song-local,.song-meaning,.song-test{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:12px}summary{cursor:pointer;line-height:1.7}.song-meaning p{line-height:1.9;margin:14px 0}.song-question{padding:18px 0;border-bottom:1px solid var(--line)}.song-test .opts{display:grid;gap:8px}.song-local input[type=file]{max-width:100%}.song-course select{font:inherit;padding:8px;border-radius:8px}.song-course progress{accent-color:var(--ai)}

/* Layout: 時間割式 — wide screens get a sticky left timetable of the day's subjects; phones get a sticky scrolling tab strip. */
:root{
  --paper:#F1F4F7; --card:#FFFFFF; --ink:#18212F; --muted:#5A6576; --line:#D3DAE3;
  --ai:#2D4A7C; --ai-soft:#E3EAF5; --mark:#F2D266; --mark-ink:#5C4700;
  --ok:#2F7552; --ok-soft:#E2F1E8; --ng:#A93437; --ng-soft:#F7E3E3; --night:#3B2F5C; --night-soft:#ECE7F6;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E141E; --card:#151D2A; --ink:#E3E8EF; --muted:#94A1B3; --line:#283244;
  --ai:#93B2E9; --ai-soft:#1D2A40; --mark:#E2C352; --mark-ink:#201800;
  --ok:#72C496; --ok-soft:#16291F; --ng:#EE8585; --ng-soft:#2E1A1B; --night:#C3B3EC; --night-soft:#231D36; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E141E; --card:#151D2A; --ink:#E3E8EF; --muted:#94A1B3; --line:#283244;
  --ai:#93B2E9; --ai-soft:#1D2A40; --mark:#E2C352; --mark-ink:#201800;
  --ok:#72C496; --ok-soft:#16291F; --ng:#EE8585; --ng-soft:#2E1A1B; --night:#C3B3EC; --night-soft:#231D36; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;line-height:1.35;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:16px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-size:34px;font-weight:800;letter-spacing:.04em}
.brand .sub{color:var(--muted);font-size:13px}
.count{display:flex;gap:10px 18px;align-items:baseline;flex-wrap:wrap}
.count b{font-family:var(--f-mono);font-size:30px;color:var(--ai);font-variant-numeric:tabular-nums}
.count span{color:var(--muted);font-size:13px}
.packbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.packbar select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px;max-width:100%}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:grid;gap:18px}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs button{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:6px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--muted)}
nav.tabs button .k{font-family:var(--f-disp);font-weight:800;color:var(--ink);font-size:17px}
nav.tabs button .t{line-height:1.3}
nav.tabs button .t small{display:block;font-size:11px;letter-spacing:.04em}
nav.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:inset 3px 0 0 var(--ai)}
nav.tabs .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:700}
nav.tabs .dot.done{border-color:var(--ai);color:var(--ai)}
.side-foot{font-size:12px;color:var(--muted);line-height:1.7;display:grid;gap:8px;padding-inline:10px}
.side-foot b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
main{min-width:0}
section.view{display:grid;gap:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.h2row{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.h2row h2{font-size:26px;font-weight:800}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;font-size:14px;line-height:1.4}
.btn:hover{border-color:var(--ai)}
.btn.pri{background:var(--ai);border-color:var(--ai);color:var(--card)}
.btn.ghost{background:none}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
a.link{color:var(--ai);font-size:13px;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--ai-soft);color:var(--ai);font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.night{background:var(--night-soft);color:var(--night)}
.ja{font-size:18px;line-height:2.2}
ruby rt{font-size:.5em;color:var(--muted);font-weight:400}
body.nofuri ruby rt{visibility:hidden}
.zh{color:var(--muted);font-size:14px;line-height:1.6}
body.nozh .zh.hideable{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted)}
.toolbar label{display:inline-flex;gap:6px;align-items:center}
.toolbar select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 6px}
.tip{font-size:13px;color:var(--muted);border-left:3px solid var(--ai);padding:2px 0 2px 10px;max-width:72ch}
.tip b{color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai);width:0;transition:width .4s}
.banner{border:1px dashed var(--ai);background:var(--ai-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.banner p{margin:0;max-width:62ch}
/* 点一下就朗读的句子 */
.say-t{cursor:pointer;border-radius:6px;transition:background .15s}
.say-t:hover{background:color-mix(in srgb,var(--mark) 30%,transparent)}
/* アクセント：高的拍上面画线，降调处画竖线 */
.pl{font-size:13px;line-height:1.6;color:var(--ai);letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:2px .7em}
.pl .ph{display:inline-flex;align-items:flex-end}
.pl .m{border-top:1.5px solid transparent;padding-top:1px}
.pl .m.h{border-top-color:var(--ai)}
.pl .m.up{border-left:1.5px solid var(--ai);padding-left:1px}
.pl .m.dn{border-right:1.5px solid var(--ai);padding-right:1px}
body.nopitch .pl.opt{display:none}
.acc{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;padding:0 3px;border:1.5px solid var(--ai);border-radius:999px;font-family:var(--f-mono);font-size:11px;color:var(--ai);line-height:1}
/* listening */
.clockrow{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.clockrow .clock{font-family:var(--f-mono);font-size:30px;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:14px}
.seg-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.seg-head h3{font-size:20px}
.lines{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.line{display:grid;gap:2px;padding:8px 10px;border-radius:8px;min-width:0}
.line.playing{background:color-mix(in srgb,var(--mark) 35%,transparent)}
.line .sp{font-size:12px;color:var(--muted)}
.line .ja,.line .zh{min-width:0}
details.fold{border-top:1px solid var(--line);padding-top:10px}
details.fold summary{cursor:pointer;font-weight:700}
details.fold[open] summary{margin-bottom:6px}
.qs{display:grid;gap:4px}
.q{display:grid;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q .stem{font-weight:500}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px}
.opt:hover{border-color:var(--ai)}
.opt .n{font-family:var(--f-mono);color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
/* 讲解 */
.explain{font-size:14px;background:var(--paper);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.explain p{margin:0}
.explain .verdict{font-weight:700}
.explain .verdict.ok{color:var(--ok)}
.explain .verdict.ng{color:var(--ng)}
.why{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.why li{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:6px}
.why .n{font-family:var(--f-mono);color:var(--muted)}
.why li.ans .n{color:var(--ok);font-weight:700}
.why li.bad .n{color:var(--ng);font-weight:700}
.why .o{font-weight:500}
.point{border-left:3px solid var(--mark);background:var(--card);border-radius:0 6px 6px 0;padding:6px 10px}
.point b{color:var(--mark-ink);background:var(--mark);border-radius:4px;padding:0 6px;margin-right:6px;font-size:12px}
/* vocab */
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 16px;display:grid;gap:6px;align-content:start}
.card .w{font-family:var(--f-disp);font-size:26px;font-weight:800;line-height:1.2;justify-self:start}
.card .rd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .rd .pl{font-size:15px}
.card.known{border-color:var(--ok)}
.card .ex{font-size:15px;line-height:2}
.card .note{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
body.flash .card .zh-mean,body.flash .card .rd,body.flash .card .exzh{filter:blur(6px)}
body.flash .card.peek .zh-mean,body.flash .card.peek .rd,body.flash .card.peek .exzh{filter:none}
.gram{display:grid;gap:12px}
.gram .form{font-family:var(--f-mono);font-size:13px;background:var(--paper);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto}
.teach{display:grid;gap:8px;margin:12px 0}
.teach div{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:4px 12px}
.teach b{color:var(--ai);font-size:13px;padding-top:2px}
/* speaking */
.shadow{display:grid;gap:8px}
.sh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.sh .ja{font-size:17px;line-height:2.1}
.sh.done{border-color:var(--ok)}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card);resize:vertical}
.feedback{white-space:pre-wrap;font-size:14px;background:var(--paper);border-radius:8px;padding:12px 14px}
/* reading */
.passage{font-size:17px;line-height:2.2;display:grid;gap:8px;max-width:40em}
.passage p{margin:0}
.passage.gap{font-size:16px;background:var(--paper);border-radius:8px;padding:12px 14px;max-width:none}
mark.blank{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
/* arena */
.arenas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.stage{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 16px}
.stage:hover{border-color:var(--ai)}
.stage b{font-family:var(--f-disp);font-size:17px}
.stars{color:var(--mark);letter-spacing:2px;font-size:16px}
.stars .off{color:var(--line)}
.game{display:grid;gap:14px}
.game-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hearts{font-size:18px;letter-spacing:3px;color:var(--ng)}
.qbig{font-size:20px;line-height:2.2}
.qbig mark{background:none;color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;text-decoration-color:var(--ai)}
.star-slot{display:inline-block;min-width:3.2em;border-bottom:1.5px solid var(--ink);text-align:center;margin:0 3px}
/* culture & adult */
.prose{max-width:66ch;display:grid;gap:10px}
.prose p{margin:0}
.wordlist{display:flex;flex-wrap:wrap;gap:8px}
.wordlist span{border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--card);font-size:14px}
.adult .panel{border-color:color-mix(in srgb,var(--night) 40%,var(--line))}
.adult .line.playing{background:var(--night-soft)}
.notes{margin:0;padding-left:1.2em;display:grid;gap:4px}
.songsecs{display:grid;gap:10px}
.songsec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ss-r{display:grid;gap:6px;border-left:1px dashed var(--line);padding-left:16px}
.sw{display:grid;grid-template-columns:minmax(6.5em,auto) minmax(0,1fr);gap:4px 12px;align-items:baseline;font-size:14px}
@media (max-width:860px){ .songsec{grid-template-columns:minmax(0,1fr)} .ss-r{border-left:0;padding-left:0;border-top:1px dashed var(--line);padding-top:8px} }
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.wrongs{display:grid;gap:10px}
.wr{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px 14px;display:grid;gap:6px}
/* 学习路线沿用原有的纸张、墨蓝和明朝体。 */
.study-plan{display:grid;gap:14px;border-top:3px solid var(--ai);margin-bottom:24px}
.plan-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plan-top h2{font-size:20px}
.plan-top .row{gap:8px}.plan-details{display:grid;gap:14px}
.plan-score{font-family:var(--f-mono);color:var(--ai);font-size:14px}
.plan-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.plan-step{display:grid;gap:4px;text-align:left;border:1px solid var(--line);border-radius:8px;background:transparent;padding:10px;min-width:0}
.plan-step b{font-size:14px}.plan-step small{font-size:11px;color:var(--muted)}
.plan-step[aria-current="step"]{border-color:var(--ai);background:var(--ai-soft)}
.plan-step.done{border-color:var(--ok);background:var(--ok-soft)}
.plan-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.backup-actions{display:flex;flex-wrap:wrap;gap:6px}.backup-actions .btn{font-size:12px}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}.opt:disabled:hover{border-color:var(--line)}
.opt.right:disabled:hover{border-color:var(--ok)}.opt.wrong:disabled:hover{border-color:var(--ng)}
.review-count{font-family:var(--f-mono);font-size:20px;color:var(--ai)}
.source-note{font-size:12px;color:var(--muted);margin-top:4px}
.skip-link{position:fixed;top:8px;left:16px;transform:translateY(-160%);z-index:30;background:var(--card);padding:8px 12px;color:var(--ai)}
.skip-link:focus{transform:none}
@media (max-width:560px){
 .plan-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
 .panel{padding:16px}.packbar{width:100%}.packbar select{width:100%;min-width:0}
 .plan-step{min-height:72px}.opt{padding:11px 12px;min-height:46px}
 nav.tabs button{min-height:44px}.btn{min-height:40px}
 .count{gap:6px 10px}.count span{font-size:12px}
}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{position:static;display:contents}
  nav.tabs{position:sticky;flex-direction:row;overflow-x:auto;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:8px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);scrollbar-width:none}
  nav.tabs button{grid-template-columns:auto auto;flex:0 0 auto;padding:6px 10px}
  nav.tabs button .t small,nav.tabs .dot{display:none}
  nav.tabs button[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--ai)}
  .side-foot{order:9;padding-inline:0}
  .brand h1{font-size:28px}
  .count b{font-size:24px}
  .teach div{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <div class="brand">
      <h1>N2 道場</h1>
      <span class="sub" id="weekLabel"></span>
    </div>
    <div class="count">
      <span>备考目标 2027-07-04（日，暂定）</span><b id="daysLeft">—</b><span>天</span>
    </div>

  </header>

    <nav class="tabs" role="tablist" aria-label="今日の時間割" id="tabs"></nav>

  <main id="main" tabindex="-1"></main>
</div>

<script>

/* 一个语调短语：ms = 拍，acc = 降调位置（1 起算；0 = 不降）。word=true 时按词典型号：acc 等于拍数是尾高型，在最后一拍后降 */
function phraseHTML(ms,acc,word=false){
  const n=ms.length, hi=i=> acc===1 ? i===0 : (i>0 && (acc===0 || i<acc));
  return `<span class="ph">${ms.map((m,i)=>{ const h=hi(i), c=[h?"h":"l"]; if(h&&i>0&&!hi(i-1)) c.push("up"); if(h&&acc>0&&(acc<n||word)&&i===acc-1) c.push("dn"); return `<span class="m ${c.join(" ")}">${esc(m)}</span>`; }).join("")}</span>`;
}

/* 整个文件先下载成 blob 再播：不依赖服务器支持断点续传，跳到哪一句都准 */
const audioDiag={state:"",last:""}; function diag(k,v){ audioDiag[k]=v; const d=$("#audioDiag"); if(d) d.textContent=`音频：${audioDiag.state}${audioDiag.last?" · "+audioDiag.last:""}`; }
const dayReady={};
function dayEl(file){ return dayAudio[file] ||= fetch(file).then(r=>{ if(!r.ok) throw new Error("下载失败 "+r.status); return r.blob(); }).then(b=>{ diag("state",`已下载 ${(b.size/1048576).toFixed(1)}MB`); return (dayReady[file]=Object.assign(new Audio(URL.createObjectURL(b)),{preload:"auto"})); }).catch(e=>{ diag("state",String(e&&e.message||e)); throw e; }); }
function playClip(c,rate,onend,fallback){
  /* 已经下载好就在点击的同一时刻直接播（iPhone 只允许“点了马上播”），没下载好才等 */
  if(dayReady[c.file]) return runClip(dayReady[c.file],c,rate,onend,fallback);
  let cancelled=false; clipStop=()=>{ cancelled=true; };
  dayEl(c.file).then(a=>{ if(!cancelled) runClip(a,c,rate,onend,fallback); }).catch(()=>{ if(cancelled) return; clipStop=null;
    /* 下载失败多半是页面开着时配音更新了、旧文件被换掉：重新取 index.json，提示再点一次，不退回本机朗读（本机朗读常读错汉字） */
    delete dayAudio[c.file]; delete store.audio[currentId]; ensureAudio(currentId);
    toast("配音刚更新过，已重新加载，再点一次就好"); onend&&onend(); });
}
function runClip(a,c,rate,onend,fallback){
  a.preservesPitch=true; a.playbackRate=rate; let raf=0, done=false;
  const finish=()=>{ if(done) return; done=true; cancelAnimationFrame(raf); a.pause(); a.muted=false; clipStop=null; onend&&onend(); };
  const tick=()=>{ if(a.currentTime>=c.span[1]) finish(); else raf=requestAnimationFrame(tick); };
  /* iPhone Safari：音频没开始播放前跳转会被忽略（就会从文件开头播）。先静音播放，再跳到这一句，跳好了才出声 */
  const unmuteAt=()=>{ let ok=false; const go=()=>{ if(ok||done) return; ok=true; a.muted=false; raf=requestAnimationFrame(tick); };
    a.addEventListener("seeked",go,{once:true}); try{ a.currentTime=c.span[0]; }catch(e){} setTimeout(()=>{ if(Math.abs(a.currentTime-c.span[0])<0.3) go(); },250); };
  const start=()=>{ a.muted=true; try{ a.currentTime=c.span[0]; }catch(e){} a.play().then(()=>{ diag("last","VOICEVOX 播放中"); unmuteAt(); }).catch(e=>{ a.muted=false; diag("last","播放被拒："+(e&&e.name)); done=true; clipStop=null; if(e&&e.name==="NotAllowedError"){ toast("浏览器拦住了这次播放，再点一下就好"); onend&&onend(); } else fallback(); }); };
  clipStop=()=>{ done=true; cancelAnimationFrame(raf); a.pause(); a.muted=false; };
  a.onended=finish; a.onerror=()=>{ diag("last","音频出错 code "+(a.error&&a.error.code)); if(!done){ done=true; clipStop=null; fallback(); } };
  start(); /* 不等 loadedmetadata：iPhone 在 play() 之前不加载音频，等它会永远等不到 */
}

function ttsSpeak(text,{onend,rate}={}){ diag("last","用了本机朗读"); if(!tts.ok){toast("这个浏览器不支持语音朗读");onend&&onend();return;} const u=new SpeechSynthesisUtterance(plain(text)); u.lang="ja-JP"; if(tts.voice) u.voice=tts.voice; u.rate=rate||tts.rate; if(onend){u.onend=onend;u.onerror=onend;} speechSynthesis.speak(u); }
function speak(text,{onend,rate,key}={}){
  stopAudio(); if(tts.ok) speechSynthesis.cancel(); markListenActivity();
  const clip=clipOf(key), rr=Math.max(0.5,Math.min(1.5,(rate||tts.rate)/0.9));
  if(clip){ playClip(clip,rr,onend,()=>ttsSpeak(text,{onend,rate})); return; }
  const url=audioUrl(key);
  if(url){ const a=new Audio(url); a.preservesPitch=true; a.playbackRate=Math.max(0.5,Math.min(1.5,(rate||tts.rate)/0.9)); curAudio=a;
    let fell=false; const fallback=()=>{ if(fell) return; fell=true; if(curAudio===a) curAudio=null; ttsSpeak(text,{onend,rate}); };
    a.onended=()=>{ if(curAudio===a) curAudio=null; onend&&onend(); }; a.onerror=fallback; a.play().catch(fallback); return; }
  ttsSpeak(text,{onend,rate});
}
function speakSeq(items,onEach,onDone,keys=[]){ let i=0, stopped=false; const next=()=>{ if(stopped) return; if(i>=items.length){onEach(-1);onDone&&onDone();return;} onEach(i); speak(items[i],{key:keys[i],onend:()=>{i++; setTimeout(next,350);}}); }; next(); return ()=>{stopped=true;stopAudio();if(tts.ok)speechSynthesis.cancel();onEach(-1);}; }

function qid(q){ return String(q.q)+"｜"+(q.options||[]).join("｜"); }
function mergeRecord(a={},b={}){
  const r={...b,...a};
  r.listenSec=Math.max(Number(a.listenSec)||0,Number(b.listenSec)||0);
  for(const k of ["vocab","gram","shadow","learned"]) r[k]=[...new Set([...(a[k]||[]),...(b[k]||[])])];
  for(const k of ["qs","choices","answered"]) r[k]={...(b[k]||{}),...(a[k]||{})};
  r.arena={...(b.arena||{})}; for(const [k,v] of Object.entries(a.arena||{})) r.arena[k]=Math.max(v,r.arena[k]||0);
  for(const k of ["role","culture","adult"]) r[k]=!!(a[k]||b[k]);
  return r;
}
function mergeProgress(a={},b={}){
  const prepare=p=>{
    p=JSON.parse(JSON.stringify(p||{})); p.days||={}; p.materials||={};
    if(p.version!==2) for(const [id,day] of Object.entries(p.days)){
      if(!p.materials[id]) p.materials[id]=JSON.parse(JSON.stringify(day));
    }
    return p;
  };
  a=prepare(a); b=prepare(b);
  const mergeMap=(x={},y={})=>Object.fromEntries([...new Set([...Object.keys(y),...Object.keys(x)])].map(k=>[k,mergeRecord(x[k],y[k])]));
  const wrong=new Map();
  for(const q of [...(a.wrong||[]),...(b.wrong||[])]) if(!wrong.has(qid(q))) wrong.set(qid(q),q);
  return {version:2,days:mergeMap(a.days,b.days),materials:mergeMap(a.materials,b.materials),songs:mergeMap(a.songs,b.songs),wrong:[...wrong.values()].slice(0,300),arena:{...(b.arena||{}),...(a.arena||{})}};
}
function materialProgress(progress,id){
  progress.materials||={}; const x=progress.materials[id]||={};
  x.listenSec??=0; x.vocab??=[]; x.gram??=[]; x.shadow??=[]; x.arena??={}; x.qs??={}; x.choices??={};
  return x;
}

async function importProgress(file){
  if(!file)return;
  try{
    if(file.size>5*1024*1024)throw new Error("备份文件不能超过 5MB");
    const parsed=JSON.parse(await file.text()), p=parsed.progress||parsed;
    if(!p||!p.days||typeof p.days!=="object"||Array.isArray(p.days)||!Array.isArray(p.wrong))throw new Error("不是有效的学习记录备份");
    for(const k of ["days","materials"]){ if(p[k]&&(typeof p[k]!=="object"||Array.isArray(p[k])))throw new Error("记录格式不正确"); for(const [id,d] of Object.entries(p[k]||{})){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(id)||!d||typeof d!=="object"||Array.isArray(d))throw new Error("教材记录格式不正确");
      for(const key of ["vocab","gram","shadow","learned"])if(d[key]&&!Array.isArray(d[key]))throw new Error("进度格式不正确");
      if(d.listenSec!=null&&(!Number.isFinite(d.listenSec)||d.listenSec<0))throw new Error("听力时间格式不正确");
    }}
    if(p.songs&&(typeof p.songs!=="object"||Array.isArray(p.songs)))throw new Error("歌曲进度格式不正确");
    for(const d of Object.values(p.songs||{})){
      if(!d||typeof d!=="object"||!Array.isArray(d.learned)||!d.learned.every(Number.isInteger))throw new Error("歌曲学习标记格式不正确");
      for(const k of ["qs","choices"])if(d[k]&&(typeof d[k]!=="object"||Array.isArray(d[k])))throw new Error("歌曲测验格式不正确");
    }
    if(!p.wrong.every(q=>q&&typeof q.q==="string"&&Array.isArray(q.options)&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length))throw new Error("错题格式不正确");
    stopAll(); game=null; store.progress=mergeProgress(store.progress,p); saveProgress(); rerender(); toast("记录已合并，保留现有进度与错题");
  }catch(e){toast("恢复失败："+(e.message||"文件无法读取"));}
}

function expBox(q,chosen){

    opts.append(b); });

    if(i in p.choices){feedback.append(expBox(q,p.choices[i]));const again=el('button',{class:'btn small'},'重做这题');again.onclick=()=>{delete p.choices[i];delete p.qs[i];saveProgress();refresh();drawQuiz();};feedback.append(again);}item.append(feedback);quizBody.append(item);
  });}

function vWrong(v){

  if(!w.length){ v.append(el("div",{class:"empty"},"还没有待复习的错题。闯关、听力、读解和语法练习答错后会自动收进这里。")); const b=el("button",{class:"btn pri"},"去做题");b.onclick=()=>go("arena");v.append(b);return; }
  const review=el("div",{class:"panel row",style:"justify-content:space-between"},`<div><b>把错题再做一遍</b><div class="small muted">随机最多 10 题 · 不扣心 · 答对后移出错题本</div></div>`);
  const start=el("button",{class:"btn pri"},"开始错题复习");start.onclick=()=>{const items=[...w];for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}gameResult=null;game={idx:-1,review:true,items:items.slice(0,10),name:"错题集中复习",qi:0,hearts:3,right:0,answered:false};go("arena");};review.append(start);v.append(review);
  const list=el("div",{class:"wrongs"});

function rotation(d){
  const n=Math.round((d-START)/864e5);
  const A=`{"name":"問題3 語形成","zh":"选出最适合填入（　）的前缀或后缀","items":[5 题，同上的 explain/why/point]},
 {"name":"問題5 言い換え類義","zh":"选出和划线词意思最接近的","items":[5 题，题干考查词放在【】里]},`;
  const B=`{"name":"問題6 用法","zh":"选出用法最正确的句子","items":[5 题，q 只写那个词，options 是四个用这个词的句子，干扰句用近音近形词该出现的位置]},
 {"name":"問題9 文章の文法","zh":"读文章，选出最适合填入（　）的内容","passage":["带标记的日语段落，200～350 字，含（ 1 ）～（ 5 ）五个空"],"items":[{"q":"（ 1 ）",...},…共 5 题，考接续词、授受、文末表达、指示词]},`;
  return { arena:n%2===0?A:B, listen:["問題3 概要理解","問題5 統合理解","問題1 課題理解"][((n%3)+3)%3],
    read:["問題10 内容理解（短文）","問題11 内容理解（中文）","問題12 統合理解（A、B 两篇短文比较）","問題13 主張理解（長文）","問題14 情報検索","問題10 内容理解（短文・メール）"][((n%6)+6)%6] };
}
